<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="game-container" role="main" aria-label="Snake Game">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <span>🐍</span> Snake
            </div>
            <div class="score-group">
                <div class="score-item">
                    <span class="label">Score</span>
                    <span class="value" id="scoreDisplay">0</span>
                </div>
                <div class="score-item">
                    <span class="label">🏆</span>
                    <span class="value high" id="highScoreDisplay">0</span>
                </div>
                <span class="diff-badge" id="diffBadge">Medium</span>
            </div>
        </header>

        <!-- ===== BOARD ===== -->
        <div class="board-wrapper" id="boardWrapper">
            <canvas id="gameCanvas" width="600" height="600"></canvas>

            <!-- Countdown Overlay -->
            <div class="countdown" id="countdownOverlay">
                <div class="number" id="countdownNumber">3</div>
                <div class="label">Get ready!</div>
            </div>

            <!-- Start Overlay -->
            <div class="overlay active" id="startOverlay">
                <h2>🐍 Snake</h2>
                <p class="subtitle">Classic · Modern · Fun</p>
                <div class="diff-selector" id="diffSelector" role="radiogroup" aria-label="Difficulty">
                    <button role="radio" data-diff="easy" aria-checked="false">Easy</button>
                    <button role="radio" data-diff="medium" aria-checked="true" class="active">Medium</button>
                    <button role="radio" data-diff="hard" aria-checked="false">Hard</button>
                </div>
                <button class="btn btn-primary" id="startBtn" style="font-size:1.1rem;padding:12px 40px;">
                    ▶ Play
                </button>
                <p style="color:var(--text-secondary);font-size:0.75rem;margin-top:12px;">
                    Arrow Keys · WASD · Space to Pause
                </p>
            </div>

            <!-- Game Over Overlay -->
            <div class="overlay" id="gameOverOverlay">
                <h2>💀 Game Over</h2>
                <div class="final-score" id="finalScore">0</div>
                <div class="high-score-display">🏆 High Score: <span id="finalHighScore">0</span></div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
                    <button class="btn btn-primary" id="restartBtn">🔄 Play Again</button>
                </div>
            </div>

            <!-- Pause Overlay -->
            <div class="overlay" id="pauseOverlay">
                <h2>⏸ Paused</h2>
                <p class="subtitle">Press <kbd>Space</kbd> to resume</p>
                <button class="btn btn-primary" id="resumeBtn">▶ Resume</button>
            </div>
        </div>

        <!-- ===== CONTROLS ===== -->
        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-primary" id="startBtn2">▶ Start</button>
                <button class="btn" id="pauseBtn" disabled>⏸ Pause</button>
                <button class="btn" id="restartBtn2">🔄 Restart</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-icon" id="themeToggle" aria-label="Toggle theme">🌙</button>
                <button class="btn btn-icon" id="soundToggle" aria-label="Toggle sound">🔊</button>
            </div>
        </div>

        <!-- ===== TOUCH CONTROLS ===== -->
        <div class="touch-controls" id="touchControls" aria-label="Touch controls">
            <button class="touch-btn up" data-dir="up" aria-label="Up">▲</button>
            <button class="touch-btn left" data-dir="left" aria-label="Left">◀</button>
            <button class="touch-btn down" data-dir="down" aria-label="Down">▼</button>
            <button class="touch-btn right" data-dir="right" aria-label="Right">▶</button>
            <div class="touch-btn blank"></div>
        </div>

    </div>

    <script src="js/script.js" defer></script>
</body>
</html>
